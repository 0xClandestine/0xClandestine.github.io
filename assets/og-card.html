<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source — render at 1200×630 to assets/og.png</title>
<style>
  @font-face { font-family: "Plex Mono"; font-weight: 600; font-display: block;
    src: url("fonts/plex-mono-600.woff2") format("woff2"); }
  @font-face { font-family: "Plex Mono"; font-weight: 500; font-display: block;
    src: url("fonts/plex-mono-500.woff2") format("woff2"); }
  @font-face { font-family: "Plex Sans"; font-weight: 100 700; font-display: block;
    src: url("fonts/plex-sans-var.woff2") format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    background: #000000; color: #e9e9e9; box-sizing: border-box;
    padding: 66px 72px 58px; display: flex; flex-direction: column; justify-content: space-between;
    font-family: "Plex Sans", sans-serif; -webkit-font-smoothing: antialiased;
  }
  .top { display: flex; flex-direction: column; gap: 26px; }
  .kicker { font: 500 21px/1 "Plex Mono", monospace; letter-spacing: .2em; text-transform: uppercase; color: #ffffff; }
  h1 { margin: 0; font: 600 118px/1.02 "Plex Mono", monospace; letter-spacing: -.035em; }
  h1 .z { color: #ffffff; }
  .sub { margin: 0; font-size: 30px; line-height: 1.4; color: #bfbfbf; max-width: 21ch; }
  .foot { display: flex; justify-content: space-between; align-items: baseline;
          font: 500 20px/1 "Plex Mono", monospace; color: #949494; letter-spacing: .02em; }
  .foot .m { color: #e9e9e9; }
</style>
</head>
<body>
  <div class="top">
    <div class="kicker">Ethereum × Apple Silicon</div>
    <h1><span class="z">0x</span>clandestine</h1>
    <p class="sub">Smart contracts where gas is the budget. GPU kernels where bytes are.</p>
  </div>
  <div class="foot">
    <span>github.com/<span class="m">0xclandestine</span></span>
    <span>x.com/<span class="m">0xclandestine</span></span>
  </div>
</body>
</html>
